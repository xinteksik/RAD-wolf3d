# RAD Expansion Unit configuration file 

# choose one of the following startup modes
# NORMAL = RAD is active, button goes to menu
# MENU   = RAD goes to menu
# REUx   = RAD behaves like a plain REU, x = 128K, 256K, 512K, 1M, 2M, 4M, 8M, 16M
# GEOx   = RAD behaves like a plain GeoRAM, x = 512K, 1M, 2M, 4M
STARTUP MENU

# normally there's no need to modify anything below this line!

# size of REU-window that is preloaded into L1 cache (in kilobytes), reasonable values 1 to 6
CACHING_L1_WINDOW_KB    3

# this parameter is meant to specify the offset/beginning of the part that is NOT transfered into
# L1 but in L2 cache. If this value is smaller than the one above then some memory gets preloaded into L1 and L2
CACHING_L2_OFFSET_KB    3

# number of L2-preload operators per C64-cycle (1 preload => 64 bytes)
CACHING_L2_PRELOADS_PER_CYCLE   10

#
# RPi timings 
#

WAIT_FOR_SIGNALS			80
WAIT_CYCLE_MULTIPLEXER		235
WAIT_CYCLE_READ				470
WAIT_CYCLE_WRITEDATA		470
WAIT_RELEASE_DMA			520

WAIT_OFFSET_CBTD            40
WAIT_DATA_HOLD              0
WAIT_TRIGGER_DMA            0
WAIT_BA_SIGNAL_AVAIL        261
WAIT_ENABLE_ADDRLATCH       535
WAIT_READ_BA_WRITING        256
WAIT_ENABLE_RW_ADDRLATCH    467
WAIT_ENABLE_DATA_WRITING    675

# ####################################################
# if you're using a CARTRIDGE PORT EXPANSION and 
# experience glitches/problems: use the timings below
# ####################################################

# beneficial (but only little impact)
###WAIT_BA_SIGNAL_AVAIL        300
###WAIT_READ_BA_WRITING        300

# crucial (if still glitches -> go even a bit lower)
###WAIT_ENABLE_RW_ADDRLATCH    400
###WAIT_ENABLE_DATA_WRITING    625


# not used with RAD
WAIT_CYCLE_READ_BADLINE		385
WAIT_CYCLE_READ_VIC2		428
WAIT_CYCLE_WRITEDATA_VIC2	485
WAIT_CYCLE_MULTIPLEXER_VIC2	256
