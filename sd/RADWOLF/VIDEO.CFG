# Video settings. Read once at startup; reboot after editing.
# DITHER: 0..100 percent; 100 restores the original ordered dither strength.
# BRIGHTNESS: 1..32, denominator 16. EXPOSURE: 1..512, denominator 256.
DITHER=0
BRIGHTNESS=20
EXPOSURE=350
# OFF, FRAME, STATUS, FULL. FRAME keeps world colors unchanged.
FLASH=FRAME
